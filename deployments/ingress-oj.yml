apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oj-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: oj.aimlyfy.com
      http:
        paths:
        - backend:
            service:
              name: ojapp-service
              port: 
                number: 80
          path: /
          pathType: ImplementationSpecific
